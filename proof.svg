<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
<title id="t">c-saver would have cut 16% of tool output</title>
<desc id="d">45 real Claude Code sessions, 986,797 tool-result tokens, replayed through c-saver's guards. 159,042 tokens cut: output trim 116,548, whole-file reads 25,211, folder guard 15,317, re-reads 1,966. The secret guard would also have blocked 47 .env reads.</desc>
<rect width="720" height="300" rx="8" fill="#1e1e1e"/>
<g font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
<text x="24" y="42" font-size="20" fill="#e6e6e6">c-saver would have cut 16% of tool output</text>
<text x="24" y="66" font-size="13" fill="#8a8a8a">45 real sessions replayed through its guards, no model calls</text>
<rect x="24" y="84" width="108" height="22" rx="3" fill="#d7875f"/>
<rect x="134" y="84" width="562" height="22" rx="3" fill="#3a3a3a"/>
<text x="24" y="126" font-size="13" fill="#e6e6e6">159k cut</text>
<text x="696" y="126" font-size="13" fill="#8a8a8a" text-anchor="end">of 987k tool-result tokens</text>
<g font-size="13">
<text x="24" y="172" fill="#e6e6e6">Output trim</text>
<rect x="200" y="160" width="400" height="16" rx="3" fill="#d7875f"/>
<text x="610" y="172" fill="#e6e6e6">116.5k</text>
<text x="24" y="202" fill="#e6e6e6">Whole-file reads</text>
<rect x="200" y="190" width="87" height="16" rx="3" fill="#d7875f"/>
<text x="297" y="202" fill="#e6e6e6">25.2k</text>
<text x="24" y="232" fill="#e6e6e6">Folder guard</text>
<rect x="200" y="220" width="53" height="16" rx="3" fill="#d7875f"/>
<text x="263" y="232" fill="#e6e6e6">15.3k</text>
<text x="24" y="262" fill="#e6e6e6">Re-reads</text>
<rect x="200" y="250" width="7" height="16" rx="3" fill="#d7875f"/>
<text x="217" y="262" fill="#e6e6e6">2.0k</text>
</g>
<text x="24" y="288" font-size="12" fill="#8a8a8a">Plus 47 .env reads the secret guard would have blocked.</text>
</g>
</svg>
