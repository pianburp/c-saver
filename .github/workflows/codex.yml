name: Codex
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  node-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test "codex/test/*.test.mjs"
